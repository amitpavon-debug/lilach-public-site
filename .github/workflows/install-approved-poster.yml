name: Install approved poster asset

on:
  push:
    branches: [main]
    paths:
      - "tmp-poster/**"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble approved poster
        shell: bash
        run: |
          set -euo pipefail
          count=$(find tmp-poster -maxdepth 1 -name 'part*.txt' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "10" ]; then
            echo "Waiting for all 10 poster parts; found $count."
            exit 0
          fi
          mkdir -p assets
          cat tmp-poster/part*.txt | tr -d '\n\r' | base64 --decode > assets/brain-poster-approved.webp
          test -s assets/brain-poster-approved.webp
          rm -rf tmp-poster
          rm -f .github/workflows/install-approved-poster.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved brain poster asset"
          git push
