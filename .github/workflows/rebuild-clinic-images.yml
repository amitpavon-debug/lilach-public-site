name: Rebuild clinic images
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode clinic images
        shell: bash
        run: |
          mkdir -p assets
          cat .clinic-upload/clinic-1-*.part | tr -d '\n\r' | base64 -d > assets/clinic-1.webp
          cat .clinic-upload/clinic-2-*.part | tr -d '\n\r' | base64 -d > assets/clinic-2.webp
          cat .clinic-upload/clinic-3-*.part | tr -d '\n\r' | base64 -d > assets/clinic-3.webp
          file assets/clinic-*.webp
      - name: Commit rebuilt images
        shell: bash
        run: |
          rm -rf .clinic-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-1.webp assets/clinic-2.webp assets/clinic-3.webp .clinic-upload
          git commit -m "Replace clinic images with optimized originals"
          git push
