name: Update sitemap lastmod

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'cancellations.html'
      - 'accessibility.html'
      - 'tipul-rigshi-holon.html'
      - 'cbt-holon.html'
      - 'nlp-holon.html'
      - 'tipul-beharada-holon.html'
      - 'scripts/update_sitemap_lastmod.py'
      - '.github/workflows/update-sitemap-lastmod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history for per-page update dates
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update only changed page dates
        run: python3 scripts/update_sitemap_lastmod.py

      - name: Commit sitemap only when necessary
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already reflects latest page updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore(seo): refresh sitemap lastmod from page history"
          git push origin HEAD:main
