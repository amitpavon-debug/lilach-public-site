<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>אימות תשלום PayBox | לילך פבון</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f3ef;color:#2f2f2f;font-family:Arial,sans-serif;line-height:1.6;padding:20px}
    .wrap{width:min(640px,100%);margin:24px auto}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 34px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:28px;color:#40513d}.sub{color:#667066;margin:0 0 20px}.row{padding:11px 0;border-bottom:1px solid #e0e4df}.label{font-weight:700}
    .amount{margin:18px 0;padding:16px;border-radius:14px;background:#eef3ec;color:#31533a;font-size:20px;font-weight:800;text-align:center}
    .warning{margin:18px 0;padding:14px;border-radius:14px;background:#fff4df;color:#6f4708}.actions{margin-top:22px;display:grid;gap:10px}
    button{min-height:50px;border:0;border-radius:13px;padding:13px 18px;font-size:17px;font-weight:800;cursor:pointer}.verify{background:#2f6f63;color:#fff}.verify:disabled{opacity:.55;cursor:default}
    .msg{margin-top:18px;padding:14px;border-radius:12px;text-align:center}.ok{background:#e9f8ee;color:#126331}.err{background:#fff1f0;color:#8b1712}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>אימות תשלום PayBox</h1>
      <p class="sub">יש לאמת את התשלום בפועל באפליקציית PayBox לפני אישור התור.</p>
      <div id="loading">טוען פרטים...</div>
      <div id="content" class="hidden">
        <div class="row"><span class="label">שם:</span> <span id="name"></span></div>
        <div class="row"><span class="label">תאריך:</span> <span id="date"></span></div>
        <div class="row"><span class="label">שעה:</span> <span id="time"></span></div>
        <div class="row"><span class="label">סוג פגישה:</span> <span id="type"></span></div>
        <div class="row"><span class="label">אופן:</span> <span id="mode"></span></div>
        <div class="row"><span class="label">טלפון:</span> <span id="phone"></span></div>
        <div class="amount">סכום לבדיקה: 150 ₪</div>
        <div class="warning"><strong>חשוב:</strong> יש ללחוץ על האימות רק לאחר שבדקת ב-PayBox שהתקבלו בפועל בדיוק 150 ₪ מהלקוח/ה המתאים/ה.</div>
        <div class="actions">
          <button id="verifyButton" class="verify" type="button">אימתתי שהתקבלו 150 ₪</button>
        </div>
        <div id="message" class="msg hidden"></div>
      </div>
      <div id="error" class="msg err hidden"></div>
    </section>
  </main>
  <script src="/payment-review.js?v=20261004-1715" defer></script>
</body>
</html>
