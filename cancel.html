<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ביטול פגישה | לילך פבון</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f3ef;color:#2f2f2f;font-family:Arial,sans-serif}.wrap{width:min(640px,calc(100% - 28px));margin:34px auto}.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 10px 34px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:28px}.sub{margin:0 0 22px;color:#687168;line-height:1.6}.row{padding:12px 0;border-bottom:1px solid #ececec;line-height:1.55}.label{font-weight:700}button{width:100%;margin-top:24px;padding:15px 18px;border:0;border-radius:14px;background:#9b3d36;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.message{margin-top:20px;padding:14px;border-radius:12px;line-height:1.6;text-align:center}.warning{background:#fff4df;color:#7a4a00}.error{background:#fff1f0;color:#a21d17}.success{background:#e9f8ee;color:#16723a}.loading{text-align:center;padding:28px 0;color:#687168}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>ביטול פגישה</h1>
      <p class="sub">כאן ניתן לבטל את הפגישה שנקבעה עם לילך.</p>
      <div id="loading" class="loading">טוען את פרטי הפגישה...</div>
      <div id="errorBox" class="message error hidden"></div>
      <div id="content" class="hidden">
        <div class="row"><span class="label">שם:</span> <span id="name"></span></div>
        <div class="row"><span class="label">תאריך:</span> <span id="date"></span></div>
        <div class="row"><span class="label">שעה:</span> <span id="time"></span></div>
        <div id="lateWarning" class="message warning hidden"><b>לתשומת לבך:</b><br>הביטול מתבצע פחות מ־24 שעות לפני הפגישה ולכן, בהתאם למדיניות הביטולים, כרוך בתשלום של 150 ₪.</div>
        <button id="cancelButton" type="button">אישור ביטול הפגישה</button>
        <div id="resultMessage" class="message hidden"></div>
      </div>
    </section>
  </main>
  <script src="/cancel.js" defer></script>
</body>
</html>
