<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ביטול פגישה | לילך פבון</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f3ef;color:#2f2f2f;font-family:Arial,sans-serif;line-height:1.55}.skip{position:fixed;top:10px;right:12px;z-index:10;background:#233329;color:#fff;padding:10px 14px;border-radius:10px;transform:translateY(-180%);font-weight:700}.skip:focus{transform:translateY(0)}.wrap{width:min(640px,calc(100% - 28px));margin:34px auto}.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 10px 34px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:28px}.sub{margin:0 0 22px;color:#5d675d;line-height:1.6}.row{padding:12px 0;border-bottom:1px solid #d8ddd8;line-height:1.55}.label{font-weight:700}button{width:100%;min-height:48px;margin-top:24px;padding:15px 18px;border:0;border-radius:14px;background:#8f342e;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.message{margin-top:20px;padding:14px;border-radius:12px;line-height:1.6;text-align:center}.warning{background:#fff4df;color:#6f4708}.error{background:#fff1f0;color:#8b1712}.success{background:#e9f8ee;color:#126331}.loading{text-align:center;padding:28px 0;color:#5d675d}.hidden{display:none!important}a:focus-visible,button:focus-visible{outline:3px solid #1d6655;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media(forced-colors:active){button{border:1px solid ButtonText}}
  </style>
</head>
<body>
  <a class="skip" href="#main-content">דלג לתוכן הראשי</a>
  <main id="main-content" class="wrap">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">ביטול פגישה</h1>
      <p class="sub">כאן ניתן לבטל את הפגישה שנקבעה עם לילך.</p>
      <div id="loading" class="loading" role="status" aria-live="polite" aria-busy="true">טוען את פרטי הפגישה...</div>
      <div id="errorBox" class="message error hidden" role="alert" aria-live="assertive"></div>
      <div id="content" class="hidden">
        <div class="row"><span class="label">שם:</span> <span id="name"></span></div>
        <div class="row"><span class="label">תאריך:</span> <span id="date"></span></div>
        <div class="row"><span class="label">שעה:</span> <span id="time"></span></div>
        <div id="lateWarning" class="message warning hidden" role="status" aria-live="polite"><b>לתשומת לבך:</b><br>הביטול מתבצע פחות מ־24 שעות לפני הפגישה ולכן, בהתאם למדיניות הביטולים, כרוך בתשלום של 150 ₪.</div>
        <button id="cancelButton" type="button" aria-describedby="lateWarning">אישור ביטול הפגישה</button>
        <div id="resultMessage" class="message hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
    </section>
  </main>
  <script src="/cancel.js" defer></script>
</body>
</html>
